    /* Text Shimmer Effect */

    @keyframes shimmer {

      }

      100% {
        background-position: 200% center;
      }
    }

    .animate-text-shimmer {
      background-size: 200% auto;
      animation: shimmer 3s linear infinite;

    /* Generic Shimmer for Backgrounds/Borders */

    .animate-shimmer {
      background-size: 200% 100%;

    /* Letter Blur Reveal */

    @keyframes blurIn {
      0% {

      }

      100% {

        filter: blur(0);

    .animate-blur-in {
      animation: blurIn 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    /* Slow Float */

    @keyframes float {

      0%,

        transform: translateY(0px);
      }

      50% {
        transform: translateY(-20px);
      }
    }

    .animate-float {

    /* Curtain Reveal (Exit Splash) */

    @keyframes curtainUp {

      }

      100% {

      animation: curtainUp 0.8s cubic-bezier(0.7, 0, 0.3, 1) forwards;
    }

    /* Utility Animations */

    .animate-fade-in {
      animation: fadeIn 0.8s ease-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.8s ease-out forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-scale-in {
      animation: scaleIn 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes scaleIn {
      0% {
        transform: scale(0.95);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .animate-pulse-glow {
      animation: pulse-glow 4s ease-in-out infinite;
    }

    @keyframes pulse-glow {

      0%,
      100% {
        opacity: 0.3;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(1.05);
      }
    }

    /* Toast Animation */

    .animate-slide-up-fade {
      animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideUpFade {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Slide In Right (for Saved Modal) */

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(100%);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .animate-slide-in-right {
      animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Custom Scrollbar for Sticky Containers */

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* --- VIEW TRANSITIONS --- */

    @keyframes slideInRightView {
      from {
        opacity: 0;
        transform: translate3d(40px, 0, 0) scale(1.01);
      }

      to {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    @keyframes slideInLeftView {
      from {
        opacity: 0;
        transform: translate3d(-40px, 0, 0) scale(0.99);
      }

      to {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    @keyframes viewZoomOut {
      from {
        transform: translate3d(0, 0, 0) scale(1);
        opacity: 1;
      }

      to {
        transform: translate3d(0, 0, 0) scale(0.96);
        opacity: 0.4;
      }
    }

    .animate-slide-in-right-view {
      will-change: transform, opacity;
      animation: slideInRightView 0.55s cubic-bezier(0.3, 0, 0.2, 1) forwards;
    }

    .animate-slide-in-left-view {
      will-change: transform, opacity;
      animation: slideInLeftView 0.55s cubic-bezier(0.3, 0, 0.2, 1) forwards;
    }

    .animate-view-zoom-out {
      will-change: transform, opacity;
      animation: viewZoomOut 0.55s cubic-bezier(0.3, 0, 0.2, 1) forwards;
    }
