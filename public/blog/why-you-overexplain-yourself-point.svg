<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Point, context, next step</title>
  <desc id="desc">A clear three-part message structure for communicating without overexplaining.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#160B20"/><stop offset="0.5" stop-color="#36142F"/><stop offset="1" stop-color="#0C1A2A"/></linearGradient>
    <linearGradient id="line" x1="180" y1="0" x2="1420" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#F472B6"/><stop offset="0.5" stop-color="#FBBF24"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/><text x="800" y="95" text-anchor="middle" fill="#FDE68A" font-family="Arial,sans-serif" font-size="18" font-weight="900" letter-spacing="6">THE THREE-PART MESSAGE</text><text x="800" y="134" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.48" font-family="Arial,sans-serif" font-size="17" letter-spacing="2">Say what is true, add what matters, then make the next move visible.</text>
  <path d="M220 470H1380" stroke="url(#line)" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/><g filter="url(#shadow)">
    <g transform="translate(130 250)"><rect width="390" height="390" rx="32" fill="#25102C" stroke="#F472B6" stroke-opacity="0.55" stroke-width="2"/><circle cx="72" cy="76" r="28" fill="#F472B6" fill-opacity="0.2" stroke="#F9A8D4" stroke-width="2"/><text x="62" y="86" fill="#FBCFE8" font-family="Arial,sans-serif" font-size="26" font-weight="900">1</text><text x="48" y="160" fill="#FBCFE8" font-family="Arial,sans-serif" font-size="16" font-weight="900" letter-spacing="4">POINT</text><text x="48" y="220" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="26" font-weight="800">What is true?</text><rect x="48" y="258" width="286" height="82" rx="20" fill="#3B1736" stroke="#F472B6" stroke-opacity="0.35" stroke-width="2"/><text x="72" y="307" fill="#FFFFFF" fill-opacity="0.78" font-family="Arial,sans-serif" font-size="18">“I cannot make Friday.”</text></g>
    <g transform="translate(605 250)"><rect width="390" height="390" rx="32" fill="#2A1A24" stroke="#FBBF24" stroke-opacity="0.55" stroke-width="2"/><circle cx="72" cy="76" r="28" fill="#FBBF24" fill-opacity="0.2" stroke="#FDE68A" stroke-width="2"/><text x="62" y="86" fill="#FDE68A" font-family="Arial,sans-serif" font-size="26" font-weight="900">2</text><text x="48" y="160" fill="#FDE68A" font-family="Arial,sans-serif" font-size="16" font-weight="900" letter-spacing="4">CONTEXT</text><text x="48" y="220" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="26" font-weight="800">What matters?</text><rect x="48" y="258" width="286" height="82" rx="20" fill="#3D2A20" stroke="#FBBF24" stroke-opacity="0.35" stroke-width="2"/><text x="72" y="307" fill="#FFFFFF" fill-opacity="0.78" font-family="Arial,sans-serif" font-size="18">“I have a commitment.”</text></g>
    <g transform="translate(1080 250)"><rect width="390" height="390" rx="32" fill="#14182C" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="2"/><circle cx="72" cy="76" r="28" fill="#A78BFA" fill-opacity="0.2" stroke="#C4B5FD" stroke-width="2"/><text x="62" y="86" fill="#C4B5FD" font-family="Arial,sans-serif" font-size="26" font-weight="900">3</text><text x="48" y="160" fill="#C4B5FD" font-family="Arial,sans-serif" font-size="16" font-weight="900" letter-spacing="4">NEXT STEP</text><text x="48" y="220" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="26" font-weight="800">What now?</text><rect x="48" y="258" width="286" height="82" rx="20" fill="#20213B" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="2"/><text x="72" y="307" fill="#FFFFFF" fill-opacity="0.78" font-family="Arial,sans-serif" font-size="18">“Tuesday works for me.”</text></g>
  </g>
</svg>
