<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Signs of a one-sided texting conversation</title>
  <desc id="desc">A balanced chat gradually tilts as one person keeps initiating while the other contributes less.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#0D0719"/><stop offset="0.5" stop-color="#29112F"/><stop offset="1" stop-color="#071824"/></linearGradient>
    <linearGradient id="active" x1="170" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#F472B6"/><stop offset="1" stop-color="#FBBF24"/></linearGradient>
    <linearGradient id="quiet" x1="930" y1="0" x2="1420" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#64748B" stop-opacity="0.2"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="36" fill="url(#grid)"/>
  <circle cx="390" cy="390" r="320" fill="#EC4899" fill-opacity="0.14" filter="url(#glow)"/>
  <circle cx="1210" cy="430" r="280" fill="#6366F1" fill-opacity="0.12" filter="url(#glow)"/>
  <text x="800" y="78" text-anchor="middle" fill="#FDE68A" fill-opacity="0.9" font-family="Arial,sans-serif" font-size="18" font-weight="900" letter-spacing="6">READ THE PATTERN</text>
  <text x="800" y="116" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.48" font-family="Arial,sans-serif" font-size="17" letter-spacing="2">One quiet reply means little. Repeated one-way effort means more.</text>
  <g filter="url(#shadow)">
    <rect x="120" y="170" width="600" height="550" rx="34" fill="#21102F" stroke="#F472B6" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="120" y="170" width="600" height="8" rx="4" fill="url(#active)"/>
    <circle cx="174" cy="232" r="24" fill="#F472B6" fill-opacity="0.2" stroke="#F9A8D4" stroke-width="2"/>
    <path d="M162 238C167 222 181 222 186 238" stroke="#FBCFE8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="174" cy="224" r="6" fill="#FBCFE8"/>
    <text x="216" y="230" fill="#FBCFE8" font-family="Arial,sans-serif" font-size="16" font-weight="900" letter-spacing="4">YOUR SIDE</text>
    <text x="164" y="278" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="28" font-weight="800">You keep the chat moving.</text>
    <rect x="164" y="306" width="512" height="1" fill="#FFFFFF" fill-opacity="0.12"/>
    <g transform="translate(164 340)">
      <rect width="360" height="70" rx="22" fill="#35152F" stroke="#F472B6" stroke-opacity="0.55" stroke-width="2"/>
      <text x="24" y="31" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="19" font-weight="700">You start the conversation.</text>
      <text x="24" y="54" fill="#FDA4AF" font-family="Arial,sans-serif" font-size="12" font-weight="900" letter-spacing="2">INITIATION</text>
      <path d="M42 70L26 94L80 70" fill="#35152F" stroke="#F472B6" stroke-opacity="0.55" stroke-width="2"/>
    </g>
    <g transform="translate(264 432)">
      <rect width="412" height="70" rx="22" fill="#30172D" stroke="#FBBF24" stroke-opacity="0.5" stroke-width="2"/>
      <text x="24" y="31" fill="#FFFFFF" fill-opacity="0.9" font-family="Arial,sans-serif" font-size="19" font-weight="700">You ask and add every detail.</text>
      <text x="24" y="54" fill="#FDE68A" font-family="Arial,sans-serif" font-size="12" font-weight="900" letter-spacing="2">CURIOSITY</text>
      <path d="M344 70L360 94L308 70" fill="#30172D" stroke="#FBBF24" stroke-opacity="0.5" stroke-width="2"/>
    </g>
    <g transform="translate(164 542)">
      <rect width="512" height="112" rx="24" fill="#120B1C" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
      <circle cx="43" cy="56" r="17" fill="#FBBF24" fill-opacity="0.16" stroke="#FBBF24" stroke-opacity="0.6" stroke-width="2"/>
      <path d="M43 44V57L51 63" stroke="#FDE68A" stroke-width="3" stroke-linecap="round"/>
      <text x="78" y="49" fill="#FFFFFF" fill-opacity="0.76" font-family="Arial,sans-serif" font-size="18" font-weight="700">Stop and see what happens</text>
      <text x="78" y="76" fill="#FFFFFF" fill-opacity="0.42" font-family="Arial,sans-serif" font-size="16">when you stop carrying every turn.</text>
    </g>
  </g>
  <g filter="url(#shadow)">
    <rect x="880" y="170" width="600" height="550" rx="34" fill="#11162B" stroke="#8B7CFF" stroke-opacity="0.42" stroke-width="2"/>
    <rect x="880" y="170" width="600" height="8" rx="4" fill="url(#quiet)"/>
    <circle cx="934" cy="232" r="24" fill="#64748B" fill-opacity="0.22" stroke="#A5B4FC" stroke-opacity="0.38" stroke-width="2"/>
    <circle cx="934" cy="224" r="6" fill="#CBD5E1" fill-opacity="0.6"/>
    <path d="M922 238C927 222 941 222 946 238" stroke="#CBD5E1" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"/>
    <text x="976" y="230" fill="#C4B5FD" font-family="Arial,sans-serif" font-size="16" font-weight="900" letter-spacing="4">THEIR SIDE</text>
    <text x="924" y="278" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="28" font-weight="800">Less comes back.</text>
    <rect x="924" y="306" width="512" height="1" fill="#FFFFFF" fill-opacity="0.12"/>
    <g transform="translate(924 340)">
      <rect width="360" height="70" rx="22" fill="#171B31" stroke="#94A3B8" stroke-opacity="0.28" stroke-width="2"/>
      <text x="24" y="31" fill="#FFFFFF" fill-opacity="0.68" font-family="Arial,sans-serif" font-size="19" font-weight="700">They rarely start a chat.</text>
      <text x="24" y="54" fill="#A5B4FC" fill-opacity="0.56" font-family="Arial,sans-serif" font-size="12" font-weight="900" letter-spacing="2">INITIATION DROPS</text>
      <path d="M42 70L26 94L80 70" fill="#171B31" stroke="#94A3B8" stroke-opacity="0.28" stroke-width="2"/>
    </g>
    <g transform="translate(1004 432)">
      <rect width="432" height="70" rx="22" fill="#171B31" stroke="#94A3B8" stroke-opacity="0.24" stroke-width="2"/>
      <text x="24" y="31" fill="#FFFFFF" fill-opacity="0.62" font-family="Arial,sans-serif" font-size="19" font-weight="700">Replies close instead of open.</text>
      <text x="24" y="54" fill="#A5B4FC" fill-opacity="0.5" font-family="Arial,sans-serif" font-size="12" font-weight="900" letter-spacing="2">FOLLOW-THROUGH FADES</text>
      <path d="M364 70L380 94L328 70" fill="#171B31" stroke="#94A3B8" stroke-opacity="0.24" stroke-width="2"/>
    </g>
    <g transform="translate(924 542)">
      <rect width="512" height="112" rx="24" fill="#0C1121" stroke="#A78BFA" stroke-opacity="0.22" stroke-width="2"/>
      <circle cx="43" cy="56" r="17" fill="#64748B" fill-opacity="0.2" stroke="#A78BFA" stroke-opacity="0.52" stroke-width="2"/>
      <path d="M36 56H50" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
      <text x="78" y="49" fill="#FFFFFF" fill-opacity="0.7" font-family="Arial,sans-serif" font-size="18" font-weight="700">Do not decode one message.</text>
      <text x="78" y="76" fill="#FFFFFF" fill-opacity="0.38" font-family="Arial,sans-serif" font-size="16">Compare the pattern across time.</text>
    </g>
  </g>
  <g>
    <path d="M720 430H880" stroke="#FDE68A" stroke-opacity="0.55" stroke-width="5" stroke-dasharray="2 18" stroke-linecap="round"/>
    <path d="M720 520H880" stroke="#A5F3FC" stroke-opacity="0.3" stroke-width="5" stroke-dasharray="2 18" stroke-linecap="round"/>
    <circle cx="800" cy="476" r="54" fill="#150D24" stroke="#FDE68A" stroke-width="3"/>
    <path d="M772 476L791 495L830 454" stroke="#FDE68A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="800" y="824" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.62" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4">NOTICE THE CHANGE  |  MAKE ONE CLEAR MOVE  |  READ THE RESPONSE</text>
</svg>
