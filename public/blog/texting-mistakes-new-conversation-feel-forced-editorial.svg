<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Making a new texting conversation feel natural</title>
  <desc id="desc">A conversation moves from a crowded, forced message pattern into a clear exchange with room for both people.</desc>
  <defs>
    <linearGradient id="bg" x1="90" y1="40" x2="1510" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#170A24"/>
      <stop offset="0.5" stop-color="#2B1238"/>
      <stop offset="1" stop-color="#071923"/>
    </linearGradient>
    <linearGradient id="left" x1="180" y1="0" x2="710" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB7185"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="right" x1="950" y1="0" x2="1390" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="smallGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="500" cy="410" r="280" fill="#EC4899" fill-opacity="0.16" filter="url(#glow)"/>
  <circle cx="1190" cy="420" r="260" fill="#38BDF8" fill-opacity="0.12" filter="url(#glow)"/>
  <text x="150" y="142" fill="#FBCFE8" font-family="Arial,sans-serif" font-size="22" font-weight="900" letter-spacing="6">FORCED</text>
  <text x="1060" y="142" fill="#BAE6FD" font-family="Arial,sans-serif" font-size="22" font-weight="900" letter-spacing="6">NATURAL</text>
  <path d="M250 290C350 250 392 352 474 318C552 286 592 370 682 336" stroke="url(#left)" stroke-width="10" stroke-linecap="round"/>
  <path d="M948 336C1040 370 1090 274 1170 318C1250 362 1318 260 1408 300" stroke="url(#right)" stroke-width="10" stroke-linecap="round"/>
  <g transform="translate(145 385)">
