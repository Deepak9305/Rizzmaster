    <text x="36" y="49" fill="#FDE68A" font-family="Arial,sans-serif" font-size="17" font-weight="900" letter-spacing="3">TRYING HARD</text>
    <rect x="36" y="72" width="200" height="10" rx="5" fill="#FEF3C7" fill-opacity="0.48"/>
