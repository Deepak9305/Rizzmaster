<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Making a new texting conversation feel natural</title>
  <desc id="desc">A split chat interface contrasts an overworked conversation with a calmer exchange that gives both people room to participate.</desc>
  <defs>
    <linearGradient id="bg" x1="50" y1="20" x2="1550" y2="880" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D0717"/>
      <stop offset="0.46" stop-color="#24102F"/>
      <stop offset="1" stop-color="#061B26"/>
    </linearGradient>
    <linearGradient id="panelHot" x1="170" y1="180" x2="690" y2="710" gradientUnits="userSpaceOnUse">
      <stop stop-color="#32132F"/>
      <stop offset="1" stop-color="#160F29"/>
    </linearGradient>
    <linearGradient id="panelCool" x1="900" y1="180" x2="1430" y2="710" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102B3A"/>
      <stop offset="1" stop-color="#11152D"/>
    </linearGradient>
    <linearGradient id="hotLine" x1="210" y1="0" x2="660" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB7185"/>
      <stop offset="0.54" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="coolLine" x1="940" y1="0" x2="1390" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F0ABFC"/>
    </linearGradient>
    <linearGradient id="bridge" x1="720" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24"/>
      <stop offset="0.5" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="38" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="38" fill="url(#grid)"/>
  <circle cx="390" cy="430" r="320" fill="#EC4899" fill-opacity="0.14" filter="url(#glow)"/>
  <circle cx="1210" cy="430" r="320" fill="#22D3EE" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="800" cy="432" r="150" fill="#FDE68A" fill-opacity="0.08" filter="url(#softGlow)"/>
  <g fill="#FDE68A">
    <circle cx="145" cy="116" r="3" fill-opacity="0.72"/>
    <circle cx="262" cy="760" r="4" fill-opacity="0.4"/>
    <circle cx="684" cy="132" r="3" fill-opacity="0.58"/>
    <circle cx="918" cy="120" r="4" fill-opacity="0.45"/>
    <circle cx="1450" cy="220" r="3" fill-opacity="0.65"/>
    <circle cx="1488" cy="754" r="4" fill-opacity="0.46"/>
  </g>
  <text x="800" y="78" text-anchor="middle" fill="#FDE68A" fill-opacity="0.9" font-family="Arial,sans-serif" font-size="18" font-weight="900" letter-spacing="6">TEXTING WITHOUT THE PRESSURE</text>
  <text x="800" y="116" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.48" font-family="Arial,sans-serif" font-size="17" letter-spacing="2">The goal is not more messages. It is an easier exchange.</text>

  <g filter="url(#shadow)">
    <rect x="120" y="170" width="610" height="570" rx="34" fill="url(#panelHot)" stroke="#FB7185" stroke-opacity="0.42" stroke-width="2"/>
    <rect x="120" y="170" width="610" height="8" rx="4" fill="url(#hotLine)"/>
    <text x="164" y="232" fill="#FDA4AF" font-family="Arial,sans-serif" font-size="16" font-weight="900" letter-spacing="4">THE FORCED CHAT</text>
    <text x="164" y="274" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="29" font-weight="800">Trying to keep it alive.</text>
    <rect x="164" y="302" width="520" height="1" fill="#FFFFFF" fill-opacity="0.12"/>
    <g transform="translate(164 340)">
      <rect width="300" height="76" rx="22" fill="#30152D" stroke="#FB7185" stroke-opacity="0.38" stroke-width="2"/>
      <text x="26" y="34" fill="#FFFFFF" fill-opacity="0.9" font-family="Arial,sans-serif" font-size="21" font-weight="700">How was your day?</text>
      <text x="26" y="58" fill="#FDA4AF" fill-opacity="0.65" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">GENERIC OPENING</text>
      <path d="M38 76L24 99L76 76" fill="#30152D" stroke="#FB7185" stroke-opacity="0.38" stroke-width="2"/>
    </g>
    <g transform="translate(350 440)">
      <rect width="334" height="76" rx="22" fill="#211325" stroke="#FBBF24" stroke-opacity="0.4" stroke-width="2"/>
      <text x="26" y="34" fill="#FFFFFF" fill-opacity="0.7" font-family="Arial,sans-serif" font-size="21" font-weight="700">What do you do?</text>
      <text x="26" y="58" fill="#FDE68A" fill-opacity="0.62" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">QUESTION STACK</text>
      <path d="M272 76L288 99L240 76" fill="#211325" stroke="#FBBF24" stroke-opacity="0.4" stroke-width="2"/>
    </g>
    <g transform="translate(164 552)">
      <rect width="520" height="112" rx="24" fill="#100B1B" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
      <circle cx="42" cy="56" r="16" fill="#FB7185" fill-opacity="0.18" stroke="#FB7185" stroke-opacity="0.6" stroke-width="2"/>
      <path d="M36 50L48 62M48 50L36 62" stroke="#FDA4AF" stroke-width="3" stroke-linecap="round"/>
      <text x="76" y="48" fill="#FFFFFF" fill-opacity="0.76" font-family="Arial,sans-serif" font-size="18" font-weight="700">More effort does not create</text>
      <text x="76" y="76" fill="#FFFFFF" fill-opacity="0.42" font-family="Arial,sans-serif" font-size="16">more mutual interest.</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="870" y="170" width="610" height="570" rx="34" fill="url(#panelCool)" stroke="#38BDF8" stroke-opacity="0.42" stroke-width="2"/>
    <rect x="870" y="170" width="610" height="8" rx="4" fill="url(#coolLine)"/>
    <text x="914" y="232" fill="#BAE6FD" font-family="Arial,sans-serif" font-size="16" font-weight="900" letter-spacing="4">THE NATURAL CHAT</text>
    <text x="914" y="274" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="29" font-weight="800">Leaving room to reply.</text>
    <rect x="914" y="302" width="520" height="1" fill="#FFFFFF" fill-opacity="0.12"/>
    <g transform="translate(914 340)">
      <rect width="410" height="86" rx="24" fill="#122E3A" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="2"/>
      <text x="26" y="36" fill="#E0F2FE" font-family="Arial,sans-serif" font-size="20" font-weight="700">You mentioned that ramen place.</text>
      <text x="26" y="65" fill="#BAE6FD" fill-opacity="0.66" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">ONE REAL DETAIL</text>
      <path d="M44 86L28 110L82 86" fill="#122E3A" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="2"/>
    </g>
    <g transform="translate(1030 454)">
      <rect width="404" height="86" rx="24" fill="#1D1939" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="2"/>
      <text x="26" y="36" fill="#F5F3FF" font-family="Arial,sans-serif" font-size="20" font-weight="700">Which one should I try first?</text>
      <text x="26" y="65" fill="#DDD6FE" fill-opacity="0.66" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">EASY TO ANSWER</text>
      <path d="M342 86L358 110L306 86" fill="#1D1939" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="2"/>
    </g>
    <g transform="translate(914 578)">
      <rect width="520" height="86" rx="24" fill="#0C1828" stroke="#67E8F9" stroke-opacity="0.22" stroke-width="2"/>
      <circle cx="42" cy="43" r="16" fill="#67E8F9" fill-opacity="0.16" stroke="#67E8F9" stroke-opacity="0.65" stroke-width="2"/>
      <path d="M34 43L40 49L51 36" stroke="#A5F3FC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="36" fill="#FFFFFF" fill-opacity="0.82" font-family="Arial,sans-serif" font-size="18" font-weight="700">Specific, simple, and shared.</text>
      <text x="76" y="62" fill="#BAE6FD" fill-opacity="0.5" font-family="Arial,sans-serif" font-size="15">The next message has somewhere to go.</text>
    </g>
  </g>

  <g>
    <path d="M730 395H870" stroke="url(#bridge)" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 18"/>
    <path d="M730 492H870" stroke="url(#bridge)" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 18" opacity="0.5"/>
    <circle cx="800" cy="444" r="58" fill="#120C20" stroke="#FDE68A" stroke-width="3"/>
    <circle cx="800" cy="444" r="44" fill="#FBBF24" fill-opacity="0.1" filter="url(#softGlow)"/>
    <path d="M776 444L792 460L826 426" stroke="#FDE68A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="800" y="824" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.62" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4">SHARE SOMETHING REAL  |  ASK ONCE  |  LEAVE ROOM</text>
</svg>
