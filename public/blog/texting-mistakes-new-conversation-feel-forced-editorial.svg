    <text x="36" y="49" fill="#BAE6FD" font-family="Arial,sans-serif" font-size="17" font-weight="900" letter-spacing="3">ONE DETAIL</text>
    <rect x="36" y="72" width="194" height="10" rx="5" fill="#E0F2FE" fill-opacity="0.56"/>
    <rect x="36" y="94" width="128" height="10" rx="5" fill="#BAE6FD" fill-opacity="0.22"/>
