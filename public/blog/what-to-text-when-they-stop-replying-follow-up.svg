<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Three ways to follow up with confidence</title>
  <desc id="desc">Three abstract message cards arranged around a glowing pause symbol, representing a light check-in, a clear plan, and a respectful close.</desc>
