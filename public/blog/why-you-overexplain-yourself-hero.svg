<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Why you overexplain yourself</title>
  <desc id="desc">A clear message sits apart from a tangled cluster of extra explanations and unanswered worries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#100817"/><stop offset="0.52" stop-color="#2A1233"/><stop offset="1" stop-color="#071A29"/></linearGradient>
    <linearGradient id="clear" x1="230" y1="250" x2="720" y2="690" gradientUnits="userSpaceOnUse"><stop stop-color="#FBCFE8"/><stop offset="1" stop-color="#FDBA74"/></linearGradient>
    <linearGradient id="tangle" x1="960" y1="210" x2="1380" y2="700" gradientUnits="userSpaceOnUse"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#64748B" stop-opacity="0.25"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/><rect width="1600" height="900" rx="36" fill="url(#grid)"/>
  <circle cx="430" cy="450" r="320" fill="#EC4899" fill-opacity="0.14" filter="url(#glow)"/><circle cx="1220" cy="430" r="300" fill="#6366F1" fill-opacity="0.13" filter="url(#glow)"/>
  <text x="800" y="82" text-anchor="middle" fill="#FDE68A" fill-opacity="0.9" font-family="Arial,sans-serif" font-size="18" font-weight="900" letter-spacing="6">CLARITY WITHOUT THE DEFENCE</text>
  <text x="800" y="120" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.48" font-family="Arial,sans-serif" font-size="17" letter-spacing="2">Your point deserves to be heard before your panic explains it away.</text>
  <g filter="url(#shadow)">
    <rect x="120" y="190" width="600" height="540" rx="36" fill="#241029" stroke="#F472B6" stroke-opacity="0.5" stroke-width="2"/><rect x="120" y="190" width="600" height="8" rx="4" fill="url(#clear)"/>
    <text x="176" y="260" fill="#FBCFE8" font-family="Arial,sans-serif" font-size="16" font-weight="900" letter-spacing="4">THE MESSAGE</text>
    <text x="176" y="318" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="30" font-weight="800">I cannot make Friday.</text>
    <rect x="176" y="355" width="470" height="2" fill="#FFFFFF" fill-opacity="0.13"/>
    <rect x="176" y="400" width="380" height="62" rx="20" fill="#3B1736" stroke="#FBBF24" stroke-opacity="0.55" stroke-width="2"/><text x="202" y="438" fill="#FFFFFF" fill-opacity="0.9" font-family="Arial,sans-serif" font-size="18" font-weight="700">I already have a commitment.</text>
    <rect x="176" y="490" width="470" height="112" rx="24" fill="#130C20" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/><circle cx="220" cy="546" r="17" fill="#FBBF24" fill-opacity="0.18" stroke="#FBBF24" stroke-opacity="0.7" stroke-width="2"/><path d="M213 546L219 552L229 539" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="258" y="540" fill="#FFFFFF" fill-opacity="0.82" font-family="Arial,sans-serif" font-size="18" font-weight="700">I can do Tuesday instead.</text><text x="258" y="570" fill="#FFFFFF" fill-opacity="0.42" font-family="Arial,sans-serif" font-size="15">A point, useful context, and a next step.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="880" y="190" width="600" height="540" rx="36" fill="#11162B" stroke="#8B7CFF" stroke-opacity="0.4" stroke-width="2"/><rect x="880" y="190" width="600" height="8" rx="4" fill="url(#tangle)"/>
    <text x="936" y="260" fill="#C4B5FD" font-family="Arial,sans-serif" font-size="16" font-weight="900" letter-spacing="4">THE TANGLE</text>
    <path d="M960 330C1110 250 1240 440 1370 340C1300 500 1100 350 970 520C1080 610 1210 480 1370 580" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round"/>
    <path d="M1000 355C1150 530 1260 260 1400 430M980 600C1100 420 1260 630 1380 500" stroke="#F472B6" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
    <circle cx="1090" cy="400" r="12" fill="#FDE68A"/><circle cx="1280" cy="500" r="12" fill="#FDE68A"/><circle cx="1190" cy="590" r="12" fill="#FDE68A"/>
    <rect x="936" y="640" width="488" height="2" fill="#FFFFFF" fill-opacity="0.1"/><text x="936" y="682" fill="#FFFFFF" fill-opacity="0.65" font-family="Arial,sans-serif" font-size="18" font-weight="700">More words cannot guarantee</text><text x="936" y="710" fill="#FFFFFF" fill-opacity="0.42" font-family="Arial,sans-serif" font-size="16">a kinder reaction.</text>
  </g>
  <path d="M720 460H880" stroke="#FDE68A" stroke-opacity="0.58" stroke-width="5" stroke-dasharray="2 18" stroke-linecap="round"/><circle cx="800" cy="460" r="48" fill="#160D24" stroke="#FDE68A" stroke-width="3"/><path d="M778 460L794 476L824 440" stroke="#FDE68A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
