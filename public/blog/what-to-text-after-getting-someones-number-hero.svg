<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">What to text after getting someone's number</title>
  <desc id="desc">A glowing phone shows a relaxed first message connected to a real moment and a conversation prompt.</desc>
  <defs>
    <linearGradient id="background" x1="68" y1="42" x2="1519" y2="858" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0714"/>
      <stop offset="0.5" stop-color="#19091D"/>
      <stop offset="1" stop-color="#08060E"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(796 438) rotate(90) scale(370 532)">
      <stop stop-color="#EC4899" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#A21CAF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#0A0714" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phoneEdge" x1="518" y1="118" x2="1061" y2="762" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9A8D4"/>
      <stop offset="0.52" stop-color="#D946EF"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="message" x1="683" y1="578" x2="967" y2="653" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EC4899"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="largeBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="smallBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="34" fill="url(#background)"/>
  <ellipse cx="800" cy="454" rx="540" ry="380" fill="url(#centerGlow)"/>
  <ellipse cx="800" cy="738" rx="370" ry="50" fill="#EC4899" fill-opacity="0.18" filter="url(#largeBlur)"/>

  <path d="M-30 679C198 556 375 568 559 676C750 789 1004 819 1248 635C1400 520 1524 500 1630 553" stroke="#F472B6" stroke-opacity="0.22" stroke-width="4"/>
  <path d="M-30 713C198 590 375 602 559 710C750 823 1004 853 1248 669C1400 554 1524 534 1630 587" stroke="#F59E0B" stroke-opacity="0.1" stroke-width="2"/>

  <g opacity="0.72">
    <circle cx="235" cy="189" r="4" fill="#F9A8D4"/>
    <circle cx="235" cy="189" r="18" fill="#EC4899" fill-opacity="0.18" filter="url(#smallBlur)"/>
    <circle cx="1350" cy="185" r="4" fill="#FCD34D"/>
    <circle cx="1350" cy="185" r="18" fill="#F59E0B" fill-opacity="0.22" filter="url(#smallBlur)"/>
    <circle cx="1406" cy="483" r="3" fill="#F9A8D4"/>
    <circle cx="319" cy="677" r="3" fill="#FCD34D"/>
  </g>

  <g transform="translate(601 92) rotate(-7 190 360)">
    <rect x="-18" y="-18" width="416" height="756" rx="72" fill="#EC4899" fill-opacity="0.2" filter="url(#largeBlur)"/>
    <rect width="380" height="720" rx="56" fill="#070711" stroke="url(#phoneEdge)" stroke-width="8"/>
    <rect x="24" y="24" width="332" height="672" rx="38" fill="#0E0B1A" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <rect x="126" y="44" width="128" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="52" y="118" fill="#F9A8D4" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">NEW CONTACT</text>
    <text x="52" y="166" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="27" font-weight="700">Hey, it is Alex from</text>
    <text x="52" y="204" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="27" font-weight="700">the bookstore.</text>
    <rect x="52" y="238" width="214" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.2"/>
    <rect x="52" y="260" width="136" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.12"/>

    <rect x="52" y="314" width="276" height="108" rx="24" fill="#EC4899" fill-opacity="0.08" stroke="#EC4899" stroke-opacity="0.42" stroke-width="2"/>
    <circle cx="88" cy="350" r="17" fill="#F59E0B" fill-opacity="0.18" stroke="#FCD34D" stroke-width="2"/>
    <path d="M88 340V350L95 355" stroke="#FCD34D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="122" y="350" fill="#FFFFFF" fill-opacity="0.76" font-family="Arial, sans-serif" font-size="16" font-weight="700">ONE REAL DETAIL</text>
    <text x="122" y="378" fill="#F9A8D4" font-family="Arial, sans-serif" font-size="14">makes replying easy.</text>

    <rect x="52" y="478" width="276" height="76" rx="20" fill="url(#message)"/>
    <text x="190" y="526" text-anchor="middle" fill="#19091D" font-family="Arial, sans-serif" font-size="19" font-weight="800">START THE CHAT</text>
    <text x="190" y="630" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.34" font-family="Arial, sans-serif" font-size="14">recognisable  +  personal  +  easy</text>
  </g>

  <g transform="translate(1117 225) rotate(8 151 113)">
    <rect width="302" height="230" rx="30" fill="#130D1D" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="3"/>
    <rect x="24" y="26" width="254" height="48" rx="16" fill="#F59E0B" fill-opacity="0.12"/>
    <text x="47" y="58" fill="#FCD34D" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">SHARED MOMENT</text>
    <text x="34" y="122" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="700">Bookstore debate</text>
    <text x="34" y="160" fill="#FFFFFF" fill-opacity="0.55" font-family="Arial, sans-serif" font-size="17">What should I read next?</text>
    <path d="M34 188H192" stroke="#EC4899" stroke-width="4" stroke-linecap="round"/>
    <path d="M215 183L225 193L250 168" stroke="#FCD34D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#F9A8D4">
    <path d="M405 254L412 273L431 280L412 287L405 306L398 287L379 280L398 273L405 254Z"/>
    <path d="M1215 563L1222 582L1241 589L1222 596L1215 615L1208 596L1189 589L1208 582L1215 563Z"/>
    <path d="M491 500L496 513L509 518L496 523L491 536L486 523L473 518L486 513L491 500Z" fill="#FCD34D"/>
  </g>
  <text x="800" y="832" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.42" font-family="Arial, sans-serif" font-size="18" letter-spacing="5">MAKE THE FIRST MESSAGE EASY TO ANSWER</text>
</svg>

