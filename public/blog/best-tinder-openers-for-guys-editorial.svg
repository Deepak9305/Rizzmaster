<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">A specific Tinder opener</title>
  <desc id="desc">A dating profile detail travels into a playful opener that gives a match a clear reason to reply.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#140724"/><stop offset="0.48" stop-color="#32134A"/><stop offset="1" stop-color="#08202C"/></linearGradient>
    <linearGradient id="profile" x1="180" y1="180" x2="660" y2="700" gradientUnits="userSpaceOnUse"><stop stop-color="#EC4899"/><stop offset="0.56" stop-color="#8B5CF6"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="prompt" x1="870" y1="240" x2="1400" y2="610" gradientUnits="userSpaceOnUse"><stop stop-color="#F9A8D4"/><stop offset="0.6" stop-color="#FBBF24"/><stop offset="1" stop-color="#FB7185"/></linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="36" fill="url(#grid)"/>
  <circle cx="360" cy="420" r="300" fill="#EC4899" fill-opacity="0.16" filter="url(#glow)"/>
  <circle cx="1240" cy="420" r="300" fill="#FBBF24" fill-opacity="0.1" filter="url(#glow)"/>
  <g fill="#FDE68A">
    <circle cx="124" cy="164" r="3" fill-opacity="0.65"/><circle cx="748" cy="162" r="4" fill-opacity="0.5"/><circle cx="1470" cy="182" r="3" fill-opacity="0.6"/><circle cx="1420" cy="742" r="4" fill-opacity="0.45"/>
  </g>
  <text x="800" y="78" text-anchor="middle" fill="#FDE68A" fill-opacity="0.92" font-family="Arial,sans-serif" font-size="18" font-weight="900" letter-spacing="6">DO NOT OPEN WITH JUST HEY</text>
  <text x="800" y="116" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.48" font-family="Arial,sans-serif" font-size="17" letter-spacing="2">Notice one real detail, then give the conversation somewhere to go.</text>
  <g filter="url(#shadow)">
    <rect x="150" y="172" width="500" height="548" rx="36" fill="#13132A" stroke="#F9A8D4" stroke-opacity="0.5" stroke-width="3"/>
    <rect x="180" y="202" width="440" height="240" rx="28" fill="url(#profile)"/>
    <circle cx="400" cy="316" r="66" fill="#FDE68A" fill-opacity="0.3"/>
    <path d="M320 416C348 358 452 358 480 416" stroke="#FDE68A" stroke-opacity="0.78" stroke-width="13" stroke-linecap="round"/>
    <circle cx="400" cy="308" r="25" fill="#FFF7ED" fill-opacity="0.6"/>
    <text x="205" y="490" fill="#FBCFE8" font-family="Arial,sans-serif" font-size="15" font-weight="900" letter-spacing="4">PROFILE DETAIL</text>
    <text x="205" y="532" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="25" font-weight="800">Photo: mountain hike</text>
    <rect x="205" y="560" width="190" height="42" rx="21" fill="#F9A8D4" fill-opacity="0.16" stroke="#F9A8D4" stroke-opacity="0.55" stroke-width="2"/>
    <text x="226" y="586" fill="#FBCFE8" font-family="Arial,sans-serif" font-size="13" font-weight="900" letter-spacing="2">REAL DETAIL</text>
    <rect x="412" y="560" width="166" height="42" rx="21" fill="#93C5FD" fill-opacity="0.12" stroke="#93C5FD" stroke-opacity="0.5" stroke-width="2"/>
    <text x="435" y="586" fill="#BFDBFE" font-family="Arial,sans-serif" font-size="13" font-weight="900" letter-spacing="2">USE IT</text>
    <text x="205" y="654" fill="#FFFFFF" fill-opacity="0.46" font-family="Arial,sans-serif" font-size="17">Specific beats impressive.</text>
  </g>
  <path d="M680 444H868" stroke="url(#prompt)" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 20"/>
  <circle cx="774" cy="444" r="54" fill="#180B22" stroke="#FDE68A" stroke-width="3"/>
  <path d="M750 444L767 461L800 428" stroke="#FDE68A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <path d="M900 230C900 202 922 180 950 180H1390C1418 180 1440 202 1440 230V510C1440 538 1418 560 1390 560H1060L938 650V560H950C922 560 900 538 900 510V230Z" fill="url(#prompt)"/>
    <text x="950" y="270" fill="#411225" font-family="Arial,sans-serif" font-size="17" font-weight="900" letter-spacing="4">A SPECIFIC OPENER</text>
    <text x="950" y="342" fill="#411225" font-family="Arial,sans-serif" font-size="29" font-weight="800">Was the hike worth</text>
    <text x="950" y="384" fill="#411225" font-family="Arial,sans-serif" font-size="29" font-weight="800">the view or the snacks?</text>
    <path d="M950 444H1260" stroke="#411225" stroke-opacity="0.28" stroke-width="8" stroke-linecap="round"/>
    <circle cx="1362" cy="444" r="34" fill="#411225" fill-opacity="0.14"/>
    <path d="M1347 444L1358 455L1378 430" stroke="#411225" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(870 664)">
    <rect width="560" height="58" rx="29" fill="#110A1B" stroke="#F9A8D4" stroke-opacity="0.3" stroke-width="2"/>
    <text x="280" y="36" text-anchor="middle" fill="#FBCFE8" font-family="Arial,sans-serif" font-size="15" font-weight="900" letter-spacing="3">DETAIL  ->  POINT OF VIEW  ->  EASY REPLY</text>
  </g>
  <text x="800" y="824" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.62" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4">NOTICE A DETAIL  |  ASK WITH A POINT OF VIEW  |  KEEP IT EASY</text>
</svg>
