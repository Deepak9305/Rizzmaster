<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">A paused text conversation</title>
  <desc id="desc">Two message bubbles sit on opposite sides of a pause symbol, illustrating a calm follow-up after silence.</desc>
