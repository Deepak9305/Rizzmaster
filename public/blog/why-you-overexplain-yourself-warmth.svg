<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Warmth without overexplaining</title>
  <desc id="desc">A short warm message is shown beside a longer message filled with repeated apologies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#170A1E"/><stop offset="0.48" stop-color="#3D162D"/><stop offset="1" stop-color="#0C1727"/></linearGradient>
    <linearGradient id="warm" x1="220" y1="200" x2="680" y2="720" gradientUnits="userSpaceOnUse"><stop stop-color="#FBCFE8"/><stop offset="1" stop-color="#FDBA74"/></linearGradient>
    <linearGradient id="long" x1="930" y1="220" x2="1420" y2="680" gradientUnits="userSpaceOnUse"><stop stop-color="#94A3B8"/><stop offset="1" stop-color="#64748B" stop-opacity="0.25"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/><text x="800" y="86" text-anchor="middle" fill="#FDE68A" font-family="Arial,sans-serif" font-size="18" font-weight="900" letter-spacing="6">WARMTH IS NOT WORD COUNT</text><text x="800" y="124" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.48" font-family="Arial,sans-serif" font-size="17" letter-spacing="2">Acknowledgement and respect can do more than a long defence.</text>
  <g filter="url(#shadow)"><rect x="130" y="190" width="590" height="540" rx="36" fill="#24102A" stroke="#F472B6" stroke-opacity="0.5" stroke-width="2"/><rect x="130" y="190" width="590" height="8" rx="4" fill="url(#warm)"/><text x="184" y="266" fill="#FBCFE8" font-family="Arial,sans-serif" font-size="16" font-weight="900" letter-spacing="4">WARM + CLEAR</text><rect x="184" y="320" width="480" height="240" rx="28" fill="#3A1734" stroke="#F472B6" stroke-opacity="0.38" stroke-width="2"/><text x="224" y="390" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="25" font-weight="800">I appreciate the invite.</text><text x="224" y="440" fill="#FFFFFF" fill-opacity="0.8" font-family="Arial,sans-serif" font-size="22">I cannot join tonight.</text><text x="224" y="490" fill="#FDE68A" font-family="Arial,sans-serif" font-size="22" font-weight="700">Could we try Sunday?</text><circle cx="603" cy="631" r="32" fill="#FBBF24" fill-opacity="0.2" stroke="#FDE68A" stroke-width="2"/><path d="M588 631L598 641L618 617" stroke="#FDE68A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g filter="url(#shadow)"><rect x="880" y="190" width="590" height="540" rx="36" fill="#14182A" stroke="#94A3B8" stroke-opacity="0.38" stroke-width="2"/><rect x="880" y="190" width="590" height="8" rx="4" fill="url(#long)"/><text x="934" y="266" fill="#C4B5FD" font-family="Arial,sans-serif" font-size="16" font-weight="900" letter-spacing="4">THE DEFENCE</text><rect x="934" y="320" width="480" height="240" rx="28" fill="#1B2035" stroke="#94A3B8" stroke-opacity="0.3" stroke-width="2"/><text x="972" y="380" fill="#FFFFFF" fill-opacity="0.68" font-family="Arial,sans-serif" font-size="20">I am so sorry, I feel terrible,</text><text x="972" y="422" fill="#FFFFFF" fill-opacity="0.58" font-family="Arial,sans-serif" font-size="20">I know this is annoying, I promise</text><text x="972" y="464" fill="#FFFFFF" fill-opacity="0.48" font-family="Arial,sans-serif" font-size="20">I am not being difficult, it is just…</text><path d="M970 520H1380" stroke="#F472B6" stroke-opacity="0.45" stroke-width="5" stroke-dasharray="3 16" stroke-linecap="round"/><text x="934" y="641" fill="#FFFFFF" fill-opacity="0.55" font-family="Arial,sans-serif" font-size="18">The actual answer is harder to find.</text></g>
</svg>
